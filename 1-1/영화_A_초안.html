<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>내 영화 티어리스트</title>
<style>
  body {
    font-family: system-ui, "Malgun Gothic", sans-serif;
    margin: 0;
    padding: 20px;
    background: #f4f4f7;
    color: #222;
  }
  h1 { text-align: center; }
  .controls {
    display: flex;
    gap: 8px;
    justify-content: center;
    flex-wrap: wrap;
    margin-bottom: 8px;
  }
  .controls input {
    padding: 8px;
    font-size: 15px;
    min-width: 200px;
  }
  .controls button {
    padding: 8px 14px;
    font-size: 15px;
    cursor: pointer;
  }
  #message {
    text-align: center;
    color: #c0392b;
    min-height: 22px;
    margin-bottom: 10px;
  }
  .selected-info {
    text-align: center;
    color: #2c3e50;
    min-height: 22px;
    margin-bottom: 10px;
  }
  .tier {
    display: flex;
    align-items: stretch;
    margin-bottom: 8px;
    border: 1px solid #ccc;
    border-radius: 6px;
    overflow: hidden;
    background: #fff;
  }
  .tier-label {
    width: 90px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 22px;
    font-weight: bold;
    color: #fff;
    flex-shrink: 0;
  }
  .tier-S .tier-label { background: #e74c3c; }
  .tier-A .tier-label { background: #e67e22; }
  .tier-B .tier-label { background: #f1c40f; }
  .tier-C .tier-label { background: #27ae60; }
  .tier-unranked .tier-label { background: #7f8c8d; font-size: 16px; }
  .tier-cards {
    flex: 1;
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    padding: 10px;
    min-height: 50px;
  }
  .card {
    padding: 8px 12px;
    background: #ecf0f1;
    border: 2px solid transparent;
    border-radius: 6px;
    cursor: pointer;
    user-select: none;
  }
  .card.selected {
    border-color: #2980b9;
    background: #d6eaf8;
  }
</style>
</head>
<body>
  <h1>내 영화 티어리스트</h1>

  <div class="controls">
    <input type="text" id="titleInput" placeholder="새 영화 제목을 입력하세요">
    <button id="addBtn">추가</button>
    <button id="resetBtn">처음으로</button>
  </div>
  <div id="message"></div>
  <div class="selected-info" id="selectedInfo"></div>

  <div id="board"></div>

<script>
  // 저장에 사용할 키
  const STORAGE_KEY = "myMovieTierList";

  // 처음 제공되는 영화 8개
  const INITIAL_MOVIES = [
    "기생충",
    "인터스텔라",
    "라라랜드",
    "센과 치히로의 행방불명",
    "어벤져스: 엔드게임",
    "범죄도시",
    "타이타닉",
    "토이 스토리"
  ];

  // 등급 칸 정의 (unranked = 미분류)
  const TIERS = [
    { id: "S", label: "S" },
    { id: "A", label: "A" },
    { id: "B", label: "B" },
    { id: "C", label: "C" },
    { id: "unranked", label: "미분류" }
  ];

  // 영화 데이터: { id, title, tier }
  let movies = [];
  // 현재 선택된 카드의 영화 id (없으면 null)
  let selectedId = null;

  // 처음 상태의 영화 목록을 만든다
  function makeInitialMovies() {
    return INITIAL_MOVIES.map((title, i) => ({
      id: "m" + i,
      title: title,
      tier: "unranked"
    }));
  }

  // 저장: 브라우저 localStorage에 현재 상태를 기록
  function save() {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(movies));
  }

  // 불러오기: 저장된 값이 있으면 사용, 없으면 초기 상태
  function load() {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) {
      try {
        movies = JSON.parse(raw);
        return;
      } catch (e) {
        // 저장값이 깨졌으면 초기화
      }
    }
    movies = makeInitialMovies();
    save();
  }

  // 새 id 만들기 (추가한 영화용)
  function makeNewId() {
    return "m" + Date.now() + "_" + Math.floor(Math.random() * 1000);
  }

  // 안내 문구 표시
  function showMessage(text) {
    document.getElementById("message").textContent = text;
  }

  // 선택된 카드 안내 표시
  function showSelectedInfo() {
    const info = document.getElementById("selectedInfo");
    if (selectedId) {
      const m = movies.find(x => x.id === selectedId);
      info.textContent = m
        ? "선택됨: " + m.title + " — 등급을 클릭하세요"
        : "";
    } else {
      info.textContent = "";
    }
  }

  // 화면 그리기
  function render() {
    const board = document.getElementById("board");
    board.innerHTML = "";

    TIERS.forEach(tier => {
      const row = document.createElement("div");
      row.className = "tier tier-" + tier.id;

      // 등급 라벨 (클릭하면 선택된 영화를 이 등급으로 이동)
      const label = document.createElement("div");
      label.className = "tier-label";
      label.textContent = tier.label;
      label.addEventListener("click", () => moveSelectedTo(tier.id));
      row.appendChild(label);

      // 카드가 들어가는 영역
      const cardsBox = document.createElement("div");
      cardsBox.className = "tier-cards";

      movies
        .filter(m => m.tier === tier.id)
        .forEach(m => {
          const card = document.createElement("div");
          card.className = "card" + (m.id === selectedId ? " selected" : "");
          card.textContent = m.title;
          card.addEventListener("click", () => selectCard(m.id));
          cardsBox.appendChild(card);
        });

      row.appendChild(cardsBox);
      board.appendChild(row);
    });

    showSelectedInfo();
  }

  // 카드 선택/해제
  function selectCard(id) {
    selectedId = (selectedId === id) ? null : id;
    showMessage("");
    render();
  }

  // 선택된 영화를 특정 등급으로 이동
  function moveSelectedTo(tierId) {
    if (!selectedId) {
      showMessage("먼저 이동할 영화 카드를 클릭해 주세요");
      return;
    }
    const m = movies.find(x => x.id === selectedId);
    if (m) {
      m.tier = tierId;      // 한 영화는 tier 값이 하나뿐이라 한 칸에만 존재
      selectedId = null;    // 이동 후 선택 해제
      save();
      render();
    }
  }

  // 영화 추가
  function addMovie() {
    const input = document.getElementById("titleInput");
    const title = input.value.trim(); // 앞뒤 공백 제거

    // 비었거나 공백만 있으면 추가하지 않음
    if (title === "") {
      showMessage("영화 제목을 입력해 주세요");
      return;
    }

    movies.push({
      id: makeNewId(),
      title: title,
      tier: "unranked"
    });

    input.value = "";
    showMessage("");
    save();
    render();
  }

  // 처음 상태로 되돌리기
  function resetAll() {
    const ok = confirm("처음 상태로 되돌릴까요? 추가한 영화가 사라집니다.");
    if (!ok) return; // 취소하면 아무것도 바꾸지 않음

    movies = makeInitialMovies();
    selectedId = null;
    showMessage("");
    save();
    render();
  }

  // 이벤트 연결
  document.getElementById("addBtn").addEventListener("click", addMovie);
  document.getElementById("resetBtn").addEventListener("click", resetAll);
  // 입력칸에서 Enter로도 추가되게
  document.getElementById("titleInput").addEventListener("keydown", e => {
    if (e.key === "Enter") addMovie();
  });

  // 시작
  load();
  render();
</script>
</body>
</html>
